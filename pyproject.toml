[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-allocation-follow-through"
version = "0.2.0"
description = "A reproducible test of whether 10-K capital spending language improves next-year forecasts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
deep = ["torch==2.5.1", "transformers==4.46.3"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
